name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React web app
        working-directory: web
        env:
          VITE_API_BASE_URL: https://citizen-api.mywaitime.com
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Update public feed.json for News policy
        run: bash tool/update_public_feed.sh

      - name: Deploy website/ to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website
          branch: gh-pages
          clean: true
          single-commit: true
          commit-message: 'Deploy website from GitHub Actions'
